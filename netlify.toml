[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Sanity Studio (the CMS) is a single-page app at /studio.
[[redirects]]
  from = "/studio/*"
  to = "/studio/index.html"
  status = 200

# Send the bare domain to www.
[[redirects]]
  from = "https://dailydosegallery.com/*"
  to = "https://www.dailydosegallery.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/studio/*"
  [headers.values]
    X-Robots-Tag = "noindex"
